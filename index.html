<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iaon Gallery</title>
    <meta name="description" content="Iaon Gallery - Luxury Menswear and Kidswear. Instagram, WhatsApp community, Google reviews and directions." />
    <meta property="og:title" content="Iaon Gallery" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-instagram" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="17.3" cy="6.7" r="1.2" fill="currentColor" />
      </symbol>
      <symbol id="i-whatsapp" viewBox="0 0 24 24">
        <path
          d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 1.67c2.2 0 4.26.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.26-8.24Zm-3.2 3.8c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1s.9 2.44 1.03 2.6c.12.17 1.76 2.8 4.34 3.81 2.15.85 2.58.68 3.05.64.47-.04 1.5-.61 1.71-1.2.21-.6.21-1.1.15-1.2-.06-.11-.23-.17-.48-.3-.25-.12-1.5-.74-1.73-.82-.23-.09-.4-.13-.57.12-.17.25-.65.82-.8.99-.15.17-.3.19-.55.06-.25-.12-1.07-.4-2.03-1.25-.75-.67-1.26-1.5-1.4-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.3.38-.44.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.37-.78-1.87-.2-.48-.41-.42-.57-.43h-.48Z"
          fill="currentColor"
        />
      </symbol>
      <symbol id="i-review" viewBox="0 0 24 24">
        <path
          d="M12 3.2l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 3 1.1-6.1L3.2 9.6l6.1-.8L12 3.2Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-directions" viewBox="0 0 24 24">
        <path
          d="M12 21s-6.5-5.9-6.5-11A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 5.1-6.5 11-6.5 11Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M7 7h10v10M7 17 17 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
    </svg>

    <main class="page">
      <header class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="Ion Gallery" width="120" height="120" />
        <h1 class="brand-name">Iaon Gallery</h1>
        <span class="rule" aria-hidden="true"></span>
      </header>

      <!-- ================= Luxury Menswear ================= -->
      <section class="store" aria-labelledby="mens">
        <h2 id="mens" class="store-title">Luxury Menswear</h2>
        <div class="links">
          <a class="link" href="https://www.instagram.com/iaon_galleryazampura?vrfl=N2czOTgwdjFldDk2" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-instagram" /></svg></span>
            <span class="link-label">Instagram</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://whatsapp.com/channel/0029VaJdeYgJJhzUCO2AoX0C" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-whatsapp" /></svg></span>
            <span class="link-label">WhatsApp Community</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://search.google.com/local/writereview?placeid=ChIJaXKFJKWZyzsRQJbXqeJPzog" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-review" /></svg></span>
            <span class="link-label">Google Review</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://maps.app.goo.gl/u4KCrnXNcFMPGH6M7?g_st=awb" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-directions" /></svg></span>
            <span class="link-label">Google Directions</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
        </div>
      </section>

      <span class="divider" aria-hidden="true"></span>

      <!-- ================= Kidswear ================= -->
      <section class="store" aria-labelledby="kids">
        <h2 id="kids" class="store-title">Kidswear</h2>
        <div class="links">
          <a class="link" href="https://www.instagram.com/iaonkids_gallery?obrf=MWN2eXd1MGNjZm1neQ==" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-instagram" /></svg></span>
            <span class="link-label">Instagram</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://whatsapp.com/channel/0029VajZMfJ2ZjCgtM1kNy2e" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-whatsapp" /></svg></span>
            <span class="link-label">WhatsApp Community</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://search.google.com/local/writereview?placeid=ChIJEy1oGgCZyzsRsG_sZtn3Qlg" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-review" /></svg></span>
            <span class="link-label">Google Review</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
          <a class="link" href="https://maps.app.goo.gl/mXDHXoYnr3KYSoQH8?g_st=awb" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"><svg><use href="#i-directions" /></svg></span>
            <span class="link-label">Google Directions</span>
            <svg class="arrow"><use href="#i-arrow" /></svg>
          </a>
        </div>
      </section>
    </main>

    <script src="js/main.js" defer></script>
  </body>
</html>
